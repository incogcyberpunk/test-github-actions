services:
  my-express-app:
    build:
      context: .
    image: my_app:latest
    ports:
      - 3333:3333
    environment:
      whoisthere: "incog"
    container_name: "my-app-cont1"

  my-express-app2:
    image: my_app:latest
    ports:
      - 5555:3333
    environment:
      whoisthere: "incog"
    container_name: "my-app-cont2"
    depends_on:
      - my-express-app

  my-express-app3:
    image: my_app:latest
    ports:
      - 8888:3333
    environment:
      whoisthere: "incog"
    container_name: "my-app-cont3"
    depends_on:
      - my-express-app

